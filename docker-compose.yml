version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: citypass_postgres
    environment:
      POSTGRES_DB: citypass_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: